<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f2"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>Dayline</title><body><aside><h1>◈ Dayline</h1><p>Make time for what matters.</p><nav id="nav"></nav><h3>Projects</h3><div id="projects"></div><button id="newProject">+ Project</button><h3>Areas</h3><div id="areas"></div><button id="backup">Export backup</button><label class="button">Restore backup<input id="restore" type="file" accept="application/json" hidden></label></aside><main><header><div><small>YOUR DAY, IN FOCUS</small><h2 id="heading">Today</h2></div><button id="add" class="primary">＋ New</button></header><input id="search" placeholder="Search tasks, projects, labels…" type="search"><section id="content"></section></main><dialog id="editor"><form id="form"><h2>Quick capture</h2><textarea id="raw" placeholder="Meeting tomorrow at 3pm for 45 minutes #Office @calls p1"></textarea><button type="button" id="interpret">Interpret text</button><p class="hint">Review suggested fields before saving.</p><label>Title<input name="title" required></label><div class="fields"><label>Type<select name="type"><option>Task</option><option>Event</option></select></label><label>Area<input name="area"></label><label>Project<input name="project" list="projectNames"></label><label>Labels<input name="labels"></label><label>Date<input name="date" type="date"></label><label>Time<input name="time" type="time"></label><label>Duration (min)<input name="duration" type="number" min="1" max="1440"></label><label>Priority<select name="priority"><option value="1">P1 urgent</option><option value="2">P2 high</option><option value="3">P3 medium</option><option value="4">P4 normal</option></select></label><label>Repeat<select name="repeat"><option value="">Never</option><option>day</option><option>week</option><option>month</option></select></label><label>Deadline<input name="deadline" type="date"></label></div><label>Notes<textarea name="notes"></textarea></label><label>Checklist (one item per line)<textarea name="checklist"></textarea></label><footer><button type="button" id="cancel">Cancel</button><button class="primary">Save</button></footer></form></dialog><datalist id="projectNames"></datalist><script type="module" src="app.mjs"></script></body></html>
